spring.application.name=rare-x-back

# MySQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# AWS S3
cloud.aws.region.static=ap-northeast-2
cloud.aws.s3.region.static=ap-northeast-2
cloud.aws.stack.auto=false
cloud.aws.s3.bucketName=${BUCKET_NAME}
cloud.aws.credentials.accessKey=${ACCESS_KEY}
cloud.aws.credentials.secretKey=${SECRET_KEY}

# Enable Multipart upload functionality
spring.servlet.multipart.enabled=true
# 2. Max file size per request (Increased from 1MB to 5MB)
spring.servlet.multipart.max-file-size=5MB
# 3. Max total request size for multiple files
spring.servlet.multipart.max-request-size=5MB


# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Display the actual values bound to SQL query parameters (?) in the logs
logging.level.org.hibernate.orm.jdbc.bind=trace

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-validity=${JWT_ACCESS_TOKEN_VALIDITY}
jwt.refresh-token-validity=${JWT_REFRESH_TOKEN_VALIDITY}

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# Mail
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE}

# Toss Payment
toss.client-key=${TOSS_CLIENT_KEY}
toss.secret-key=${TOSS_SECRET_KEY}
toss.api-version=2022-11-16
toss.api-url=https://api.tosspayments.com/v1/

# Inspection Center
inspection-center.address=123 Teheran-ro, Gangnam-gu, Seoul, Korea
inspection-center.zipcode=06234

# Page object serialization setting
spring.data.web.pageable.page-serialization-mode=via_dto

#Passwordless
passwordless.server-key=${PASSWORDLESS_KEY}
passwordless.rest-check-url=${AUTH_SERVER_URL}
passwordless.push-connector-url=${PUSH_SERVER_URL}

#session
server.servlet.session.timeout=30m

# Juso
juso.api.key=${JUSO_CONFIRM_KEY}

# Typesense
typesense.host=${TYPESENSE_HOST}
typesense.port=${TYPESENSE_PORT}
typesense.protocol=${TYPESENSE_PROTOCOL}
typesense.api-key=${TYPESENSE_API_KEY}

# passwordless serving api
serving.api.url=${PASSWORDLESS_URL}
# Service Start Date
app.service-start-date=2025-12-29
