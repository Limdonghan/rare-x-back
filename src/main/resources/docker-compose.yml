#version: '3.8'

services:
  # Redis
  redis:
    image: redis:latest
    container_name: rare-x-redis
    ports:
      - "6379:6379"
    restart: always
    networks:
      - redis-network

  redisinsight:
    image: redis/redisinsight:latest
    container_name: simple-redisinsight
    ports:
      - 5540:5540
    networks:
      - redis-network
    depends_on:
      - redis
    volumes:
      - redis_insight_volume_data:/data

networks:
  redis-network:
    driver: bridge

volumes:
  redis_insight_volume_data:
