#version: '3.8'

services:
  # Redis
  redis:
    image: redis:latest
    container_name: rare-x-redis
    ports:
      - "6379:6379"
    restart: always
    networks:
      - redis-network

  # Redis-GUI
  redis-insight:
    image: redis/redisinsight:latest
    container_name: simple-redis-insight
    ports:
      - "5540:5540"
    networks:
      - redis-network
    depends_on:
      - redis
    volumes:
      - redis_insight_volume_data:/data

  # Typesense
  typesense:
    image: typesense/typesense:29.0
    container_name: rare-x-typesense
    ports:
      - "8108:8108"
    environment:
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY}
      - TYPESENSE_DATA_DIR=/data
    volumes:
      - typesense_data:/data
    restart: always
    networks:
      - redis-network

networks:
  redis-network:
    driver: bridge

volumes:
  redis_insight_volume_data:
  typesense_data:

