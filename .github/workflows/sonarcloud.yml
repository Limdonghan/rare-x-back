name: SonarCloud Code Analysis

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub에 올라온 내 코드를 가져옵니다.
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Java 환경(JDK 21) 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'corretto'

      # 3. Gradle 권한 부여 및 SonarCloud 검사 실행
      - name: Build and analyze with SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          chmod +x ./gradlew
          # 빌드와 함께 SonarCloud 분석을 수행합니다.
          ./gradlew build sonar --info

      # 4. SonarQube Cloud 이슈 리포트 추출
      - name: SonarQube Cloud 이슈 리포트 추출
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PROJECT_KEY: "Limdonghan_rare-x-back"
        run: |
          curl -u "$SONAR_TOKEN:" \
          "https://sonarcloud.io/api/issues/search?componentKeys=$PROJECT_KEY&ps=500" > sonar-issues.json

      # 5. 추출된 리포트를 Artifact로 저장
      - name: 추출된 리포트를 Artifact로 저장
        uses: actions/upload-artifact@v4
        with:
          name: RARE-X-Security-Report
          path: sonar-issues.json
